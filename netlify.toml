# Netlify config — MyHistamate landing page
# Static site, no build step. Deploy this folder as the publish directory.

[build]
  publish = "."

# Domain-based language routing: .com -> English (/en/), .ro -> Romanian (root)
[[edge_functions]]
  path = "/*"
  function = "domain-lang"
  excludedPath = ["/assets/*", "/brand/*", "/admin/*", "/*.js", "/*.css", "/*.json", "/*.xml", "/*.txt", "/*.jpg", "/*.jpeg", "/*.png", "/*.svg", "/*.pdf", "/*.ico", "/*.webp"]

# O SINGURĂ politică CSP pe tot site-ul. Atenție: dacă definești o a doua regulă
# de headers pe /admin/*, Netlify le aplică pe AMBELE și browserul impune
# intersecția (cea mai strictă) — exact asta bloca panoul Decap. De aceea
# sursele de care are nevoie /admin (unpkg + GitHub API + Netlify OAuth) sunt
# incluse aici, în politica unică.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https://avatars.githubusercontent.com https://raw.githubusercontent.com; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com https://unpkg.com; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com https://vooltkswkdxsmbbzgmzd.supabase.co https://api.netlify.com https://api.github.com https://raw.githubusercontent.com"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Ghidurile PDF sunt închise: accesibile DOAR prin funcția download-guide (după email).
# Fișierele fizice există în /guides-gated dar accesul HTTP direct e blocat (404 forțat),
# iar funcția le citește din bundle (included_files).
[functions]
  included_files = ["guides-gated/**"]

[[redirects]]
  from = "/guides-gated/*"
  to = "/404.html"
  status = 404
  force = true

# ---- Fișiere per domeniu (sitemap / robots / feed) ----
# Ambele domenii servesc același deploy, dar sitemap-ul și robots.txt trebuie
# să conțină DOAR URL-urile domeniului respectiv (Google ignoră URL-urile de
# pe alt host), iar feed-ul de pe .com trebuie să fie cel englezesc.
[[redirects]]
  from = "https://myhistamate.ro/sitemap.xml"
  to = "/sitemap-ro.xml"
  status = 200
  force = true

[[redirects]]
  from = "https://myhistamate.ro/robots.txt"
  to = "/robots-ro.txt"
  status = 200
  force = true

[[redirects]]
  from = "https://myhistamate.com/feed.xml"
  to = "/en/feed.xml"
  status = 301
  force = true
